<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEET PLAY SHARE, 메가박스</title>
    <link rel="stylesheet" href="../css/reset.css">
    <style>
        .box_office_card {
            position: relative;
            width: 245px;
            border-radius: 5px;
            overflow: hidden;
        }
        /* 앞면 */
        .front {
            position: relative;
        }
        .poster {
            height: 352px;
        }
        .rank {
            position: absolute;
            left: 10px;
            top: 10px;
            color: #fff;
            font-size: 2rem;
            font-weight: 300;
            font-style: italic;
            text-shadow: 2px 2px 2px #000;
        }
        .screen_type {
            position: absolute;
            left: 10px;
            bottom: 10px;
            width: 60px;

        }
        .grade {
            position: absolute;
            right: 10px;
            bottom: 10px;
            width: 28px;
        }
        .inner:hover {
            cursor: pointer;
        }
        
        .inner:hover .back {
           opacity: 1;
        }
        /* 뒷면 */
        .back {
            opacity: 0;
            position: absolute;
            left: 0;
            top: 0;
            height: 352px;
            padding: 24px;
            color: #fff;
            background: rgb(0,0,0, 0.8);
            transition: .3s;
        }
        .score {

            position: absolute;
            width: calc(100% - 48px);
            text-align: center;
            bottom: 30px;
           border:1px solid red;
            /* border-top: 1px solid rgba(255,255,255,.2); */
            padding-top: 8px;

        }
        .score span {
            color: #59bec9;
            font-size: 1.5rem;
            margin-left: 16px;  
            
        }
        /* 버튼 */
        .btn {
            display: flex;
            gap: 8px;
            /*<button>은 한 줄에 나란히 놓일 수 있는 요소(inline-block)
            <a>는 원래 글자처럼 흐르는 요소(inline)
            그래서 display: flex가 없으면 두 개가 들쭉날쭉하게 놓이고, 예매 버튼에 준 width: 100%도 제대로 먹히지 않아요. 글자 사이 공백 때문에 이상한 틈도 생기고, 화면이 좁아지면 아래로 떨어질 수도 있어요.  */
            /*
            2. gap: 8px가 작동해요
            → 둘 사이에 8px 간격이 생겨요. (gap은 flex와 함께 쓸 때 편하게 간격을 주는 속성이에요.)

            3. 남는 공간을 자동으로 나눠요
            → 좋아요 버튼은 width: 100px로 크기가 정해져 있어요.
            → 예매 링크는 width: 100%라서 남은 공간을 꽉 채워요.

            카드 너비가 245px이니까 계산해 보면:

            245px - 100px(좋아요) - 8px(간격) = 약 137px → 예매 버튼이 차지하는 크기

            4. 높이도 자동으로 맞춰져요
            → flex는 기본적으로 두 요소의 높이를 같게 늘려 줘요. 그래서 버튼과 링크가 키가 똑같이 나란히 서게 돼요.
            */
           
        }
        /* 좋아요! 버튼 */
       
        .like {
            color: #fff;
            /* 배경을 투명하게   */
            background: transparent;
            border: 1px solid #fff;
            border-radius: 5px;
            width: 100px;
            margin-top: 5px;
            /* height: 34px; */
        }
        .like i {
            margin-right: 6px;
        }
        .reservation_link {
            /* .box_office_cardwidth:245px */
            width: 100%;
            background: #037b94;
             border-radius: 5px;
             text-align: center;
             padding: 6px;
             margin-top: 5px;
            /* line-height: 34px; */
          
        }


    </style>
    
</head>
<body>
    <!-- Card UI(카드 UI) -->
     <div class="box_office_card">
        <div class="inner">
            <div class="front">
                <span class="rank">1</span>
                <div class="poster">
                    <img src="../images/main/YiSbqEf6OvFcDoLoQCipDojOHqMCwKG4_420.jpg" alt="주토피아">
                </div>
                <div class="screen_type">
                    <img src="../images/main/type_mega_mx4d.png" alt="mega mx4d">
                    <img src="../images/main/type_dolbycinema.png" alt="dolby cinema">
                    <img src="../images/main/type_dolbyatmos.png" alt="dolby atmos">
                </div>
                <div class="grade">
                    <img src="../images/main/ALL_56x56.png" alt="Grade All">
                </div>
            </div><!-- //.front -->
            
            <div class="back">
                <p>더 화려해진 세계, 더 넓어진 주토피아!<br>
                    디즈니의 가~~장 사랑스러운 콤비 '주디'와 '닉'이
                    돌아온다!<br><br>
                    미스터리한 뱀 '게리'가 나타난 순간,</p>
                    <div class="score">관람평<span>9.3</span></div>
                </div><!-- //.back -->
            </div><!-- //.inner -->
        <!-- btn -->
        <div class="btn">
            <button type="button" class="like"><i class="fa-regular fa-heart"></i>3.6k</button>
            <a href="" class="reservation_link">예매</a>
        </div>
     </div>
</body>
</html>
