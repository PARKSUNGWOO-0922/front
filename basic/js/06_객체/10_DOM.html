<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom</title>
 <style>
    button {
      display: block;
    }
    .bgc {
      background-color: lightcoral;
    }
    .dn {
      display: none;
    }
    .db {
      display: block;
    }
  </style>
</head>
<body>
  <h1>돔</h1>
  <p>여기는 돔 설명하는 곳입니다.</p>

  <script>
    /* 
    DOM(문서 객체 모델)
    - 웹 문서를 메모리로 읽어 들여 트리(Tree) 구조로 변환
    어디에 사용?
    - HTML 구조와 내용, CSS 스타일 변경에 사용

    1. 요소 선택
    - document.getElementById('아이디')
    - document.getElementsByClassName('클래스')
    - document.getElementsByTagName('태그')
    - document.querySelector('선택자')
    - document.querySelectorAll('선택자')

    2. 요소 생성 + 연결
    - document.createElement('태그명')
    - document.createTextNode('텍스트')
    - 부모요소.appendChild(자식요소);

    2-1 요소 복제
    - 요소.cloneNode(deep)
    deep: true이면 자식까지 복제(깊은복제), false이면 선택한 요소만 복제(얕은 복제)

    3. 문서 삽입(연결)
    - 요소.innerHTML;
    - 요소.textContent;
    - 요소.innerHTML = '텍스트';
    - 요소.textContent = "텍스트";

    4. 속성(Attribute) 지정하기
    - 요소.HTML속성 = HTML속성값;
    - 요소.setAttribute('HTML속성', 'HTML속성값');
    예) div.className = "div1";
    예) img.src = "경로/이미지명";
    예) div.setAttribute('class', 'div1');
    예) img.setAttribute('src', '경로/이미지명');

    5. 속성 가져오기
    - 요소.HTML속성;
    - 요소.getAttribute('HTML속성');

    6. 스타일: 요소의 스타일과 값을 지정
    - 객체.style.CSS속성 = "CSS속성값";
    - 객체.style.csstext = '속성:값; 속성:값; ...';

    7. 스타일: 클래스 이름만 정의 + CSS로 속성과 값을 지정
    
    - 클래스 추가 
        객체.classList.add('클래스명1, 클래스명2, ...') 
    - 클래스 제거
        객체.classList.remove('클래스명') 
    - 클래스 추가/제거
         객체.classList.toggle('클래스명')
    - 클래스 유무 확인:있으면  true, 없으면 false
         객체.classList.contains('클래스명') 

    8. 이벤트
     객체.on이벤트명 = 콜백함수;
     객체.on이벤트명 = function(){};
     객체.on이벤트명 = () => {};
     객체.addEventListener('이벤트명', 콜백함수);

    */

    // p,img,button 태그 생성
    const p2 = document.createElement('p');
    const img = document.createElement('img');
    const img2 = document.createElement('img');
    const btn = document.createElement('button');

    // 요소 복제
    // 생성한 버튼(btn)을 기반으로 btn2, btn3를 복제했습니다 
    const btn2 = btn.cloneNode();
    const btn3 = btn.cloneNode();

    // 텍스트 노드 생성
    const text = document.createTextNode('나두보이니?');
    //"나두보이니?"라는 글자 덩어리를 만들어 text 에저장
    // 텍스트 노드는 만든 후 반드시 appendChild로 어딘가에 조립해줘야 화면에 나옵니다. (코드의 p2.appendChild(text)처럼요.)
    
    // p1 선택
    const p1 = document.querySelector('p');

    // 생성한 태그들을 document.body의 자식으로 찰딱 붙여서 실제 HTML 문서의 일부로 편입시켰습니다.
    document.body.appendChild(p2);
    document.body.appendChild(img);
    document.body.appendChild(img2);
    document.body.appendChild(btn);
    document.body.appendChild(btn2);
    document.body.appendChild(btn3);
    p2.appendChild(text);//text를 p2에 넣는다.
    btn.textContent = '숨기기';// 해당 태그 안의 내용을 바로 수정
    btn2.textContent = '보이기';
    btn3.textContent = '보이기/숨기기';

    // 이미지태그 src 속성 추가
    img.src = 'https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/Unofficial_JavaScript_logo_2.svg/1280px-Unofficial_JavaScript_logo_2.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail&_=20141107110902';
    img2.src = 'https://upload.wikimedia.org/wikipedia/commons/7/7a/JavaScript_unofficial_logo.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original';

    img.setAttribute('width', '150px');
    // setAttribute로 너비(width)를 조작
    const w100 = img.getAttribute('width');
    // getAttribute로 첫 번째 이미지의 너비를 읽어와서 
    img2.setAttribute('width', w100);
    // 두 번째 이미지에 똑같이 적용했습니다.


    // 이미지에 테두리 지정
    img2.style.border = '5px solid red';

    // 이벤트
    // .dn 는 css 에 'display none'로 정의되어있다.
    btn.addEventListener('click', ()=>{
    // <img class = "dn">
      // img.style.display = 'none';
      img.classList.add('dn');
    });
    btn2.addEventListener('click', ()=>{
    // <img class = "dn db">
      img.classList.remove('dn');
    });
    btn3.onclick = ()=>{
      img.classList.toggle('dn');
    };

    // p1 요소가 .bgc 클래스를 가지고 있나?
    // bgc 가지고 있으면 true, 아니면 false
    if(p1.classList.contains('bgc')) {
      document.body.style.background = 'yellow';
      // location.href = "https://www.naver.com"
      // p1.classList.remove('bgc');
    } else {
      document.body.style.background = 'lightblue';
      // location.href = "https://www.google.com"
      // p1.classList.add('bgc');
    };
  </script>
</body>
</html>
