<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변환:rotate</title>
    <style>
        body {
            background-color: #2a2c44;
        }
        div {
            border:1px solid red;
            
            display: inline-block;
            /*inlin-block한이유 높이는 자동으로 이미지에 맞게 조절되지만 가로폭은 혼자 100독차지하기 때문이다*/
            
            /* width/height 지정없이도 이미지크기에 맞게 자동크기지정 */

            /* transform: rotate(0deg); */
            transition: 5s linear ;
        }
        div:hover {
            /* transform: rotate(숫자deg); 0~360이상*/
            transform: rotate(720deg);
        }
       img {
        display: block;
            /*img는 기본하단 여백을 가진다*/
       }
    </style>
</head>
<body>
    <!-- <div><img src="../../assets/imgs/curve text.png" alt="회전연습"></div> -->
    <div><img src="../../assets/imgs/curvetext.svg" alt="회전연습"></div>
</body>
</html>
