<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS:박스모델margin</title>
    <style>
        /* 
            margin : 여백;
            margin-top
            margin-right
            margin-bottom
            margin-left
        
            margin:상 우 하 좌 
            margin: 상 좌우 하 
            margin:상하 좌우 */
         section {
            display:flex;
            justify-content: flex-end;
        } 
        div {
         margin: 100px;
         background-color: darkgoldenrod;
        }
        p{
        
        /* em/엠 /단위는 글자크기의배수 */
         font-size: 16px;/* fz16 */
         margin: 1em 0;     /*1em=16px */
         background-color: darkgoldenrod;
            /* border: 1px solid #000; 자신의 border은해당없음.*/
        }
        .div2{ 
            /* 위아래 마진이 겹칠경우 큰쪽으로지정된다. */
             margin-top: 200px; /*mt200*/ 
         } 
        
        section{
            background-color: darkcyan;
           

            /* 방법1.display:flow-root */
             display: flow-root;  

            /* section과div(부모자식)간의겹침해결 */  
            /* 방법2:overflow: auto 또는 hidden; */
            /* overflow: auto; section과div(부모자식)간의 겹침해결  */
            /* overflow: hidden;auto또는 hidden 사용 */

            /* 방법3:display:flex 또는 grid */
            /* dispaly:flex;
            flex-direction: column; */
        }
    </style>
</head>
<body>
    <section>
    <div >나는 단락이다_div</div>.</div>

    <!-- <span>내용</span>  여백이 없다.-->
    <!-- <p>내용</p>p의 기본여백이 겹침 -->
    <!-- span< style="opacity:0">안보임<span> -->
    <div class="div2">나는 단락이다_div2.</div>
    </section>
</body>
</html>
