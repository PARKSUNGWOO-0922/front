<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid align</title>
    <style>
        /* 
            그리드 컨테이너 
              
                justify-content
                 - 주축(수평)에서 사용 가능한 모든 공간을 사용하지 않을 경우 그리드 콘텐츠를 정렬합니다.
                 - 기본값: normal(start,stretch)
                    - grid-template-columns:auto-> stretch
                    - 아니면: start
                    - 즉, 아이템의 크기가 auto 이면 stretch, 아니면 start
                    
                      space-evenly : 아이템을 제외한 남은 공간을 모두 같게
                      space-around : 아이템의 좌우 여백을 같게
                      space-between : 첫번째 아이템은 start, 마지막 아이템은 end 배치후 남은 아이템의 주위공간을 같게
                      center - 모든아이템을 가운데
                      start  - 모든아이템을  시작
                      end  - 모든아이템을 끝
                      stretch - grid-template-columns:auto ;일때

                      align-content - 교차축(수직)에서 사용 가능한 모든 공간을 사용하지 않을 경우 그리드 콘텐츠를 정렬합니다.
                                    - 기본값:normal(stretch)

                      place-content - align-content + justify-content 대한 약어 속성
                                   ex) place-content: center;
                                       place-content: end space-between;
                      
                      justify-items
                          - 수평으로 아이템 단위 정렬 -> 열 단위 정렬
                          - justify-content를 지정하지 않았을때(normal) 지정된다.
                          - start, end, center
                      align-items
                          - 수직으로 아이템 단위 정렬 -> 행 단위 정렬
                          - align-content를 지정하지 않았을때(normal) 지정된다.
                          - 기본값:stretch
                          - start, end, center,baseline
              

        */
      .container {
        display: grid;
        /*"모눈종이(바둑판) 판을 깔아준 건 맞는데... 가로로 몇 칸을 쪼갤지, 세로로 몇 줄을 만들지 아무런 지시를 안 했잖아? 일단 기본값인 1열짜리 세로 줄로 놔둘게." 하고 멍하니 기다리는 상태*/
        grid-template-columns:repeat(3,70px);
        /*width70px 3열로 만들어*/
        justify-content: start;
        /*이건 그냥 초기화 개념이라 생각하기로 했다.화면상에 변화는 없지만 뭔가 깔끔하게 시작환경을 만들려고 했다 이정도 ㅋ*/
        /* jss(기본값:normal )*/
        gap:5px;
        background-color: dodgerblue;
        padding: 5px;
        height: 700px;

        /* align-content(수직 배치) */

        /* 수직정렬 :수평정렬도 하나씩해보기..*/
        align-content: stretch;
        align-content: start;
        align-content: center;
        align-content: end;
        align-content: space-between;
        align-content: space-around;
        align-content: space-evenly;

        /*place-content: [세로 정렬(align)] [가로 정렬(justify)];*/
        place-content: center;
        /*정 가운데 */
        place-content: end space-between;
        /*밑에서 between 모양으로 */
        
        place-content: normal;
        /*최초 height:70px;적용시점으로 복귀*/
        /* align-items지정을 위해 content normal로 지정 */
        align-items: start;
        align-items: center;
        align-items: baseline;
        /*지금 예제는 align-items:start와 모양이 같다, 만약 크기가다른 글자들이 섞여있는 예제에서는 다르게 보임.*/

        /*justify-items셀단위 범위 즉 바둑판에 비교하면 한칸개념으로 그범위안에서 start/end/center하는거라 cell폭이 작으면 조금씩 움직이는것처럼 보인다.*/    
        justify-items: stretch;
        /*변화가 없는 이유:기본값이stretch이기때문*/
        justify-items: start;
        /*stretch가 미적용됨*/
        justify-items: end;
        justify-items: center;
      }
      /* 그리드 아이템(item) */
      .container div {
        background-color: #f1f1f1;
        border: 1px solid black;
        padding: 10px;
        font-size: 30px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
      <div>8</div>
    </div>
  </body>
</html>
