<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS플렉스 아이템</title>
    <style>
        /* 
            CSS Flex Items(플렉스항목)
            
            lex-grow는 픽셀(px)이나 절대적인 크기가 아니라, '남는 공간을 쪼개 먹는 비율(가중치)'입니다.

            <상황을 하나 가정해볼게요.> 
            부모 판에 남는 공간이 총 300px 있다고 해봅시다. 여기에 자식 둘이 있습니다.

            형 박스: flex-grow: 1;
            동생 박스: flex-grow: 2;

            이때 남는 공간 300px은 어떻게 나눠 가질까요?

            전체 비율을 더합니다: 1 + 2 = 3 (총 3조각)

            남는 공간 300px을 3조각으로 쪼갭니다. (1조각 = 100px)

            형은 1조각(100px)을 더 먹고, 동생은 2조각(200px)을 더 먹어서 원래 크기에 더해지게 됩니다!

            즉, flex-grow는 남는 공간을 누가 더 많이 차지할 것인가를 결정하는 쟁탈전 비율인 셈입니다.
            

        */
    .flex-container {
        display: flex;
        background-color: dodgerblue;
        font-size: 30px;
        text-align: center;
        
    } 
    .flex-container div {
        background-color: #f1f1f1;
        margin: 10px;
        width: 100px;
        padding: 10px;
        
    }
    .flex-container div:nth-child(1) {flex-grow:1  }   
    .flex-container div:nth-child(2) {flex-grow:1  }   
    .flex-container div:nth-child(3) {flex-grow:4  }   
        
    </style>
</head>
<body>
    <div class="flex-container">
  <div >1</div>
  <div >2</div>
  <div >3</div>
</div>
</body>
</html>
