<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS플렉스 아이템</title>
    <style>
        /* 
            CSS Flex Items(플렉스항목)
            
        3. 실전에서 어떻게 움직일까요? (값에 따른 차이)
        flex-basis: auto (기본값)

        "나한테 지정된 width나 height가 있으면 그 크기를 시작 크기로 쓸게. 만약 없으면 내 안에 들어있는 내용물(글자나 이미지) 크기만큼만 딱 시작 크기로 잡을게!" 라는 뜻입니다.

        flex-basis: 0 (크기를 무시하고 공간을 1/n로 쪼갤 때)

        이게 아주 재밌는 녀석인데요. 시작 크기를 0으로 만들어 버리면, 내용물이 뭐가 들어 있든 상관없이 "일단 너희들의 시작 크기는 전부 0이야! 그러니 남은 공간을 똑같이 공평하게 나눠 가져라!"라는 뜻이 됩니다. 화면을 꽉 채우는 박스들을 만들 때 아주 유용하게 쓰이죠

        */
    .flex-container {
        display: flex;
        background-color: dodgerblue;
        gap:10px;
        height: 100px;
        font-size: 30px;
        text-align: center;
        
    } 
    .flex-container div {
        background-color: #f1f1f1;
        margin: 10px;
        padding: 10px;
        width: 100px;
        
    }
    .flex-container div:nth-child(3) {flex-basis:250px  }   
    /*일단 내 기본 시작 크기는 250px로 해줘. 하지만 만약 빈 공간이 남으면 내가 더 커질 수도 있고, 공간이 좁아서 터질 것 같으면 내가 좀 찌그러질 수도 있어!" 하고 주변 상황에 맞춰 변할 준비가 되어 있는 유연한 크기
    그래서 고정적인 width 와는 차이가 있다.

    flex-direction: row(가로 방향)일 때는 '시작 가로 폭'이 되고,
    flex-direction: column(세로 방향)일 때는 '시작 세로 높이'가 됩니다.
    */
        
    </style>
</head>
<body>
    <div class="flex-container">
  <div >1</div>
  <div >2</div>
  <div >3</div>
  <div >4</div>
  
</div>
</body>
</html>
