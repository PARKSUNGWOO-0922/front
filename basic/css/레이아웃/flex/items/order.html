<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS플렉스 아이템</title>
    <style>
        /* 
            CSS Flex Items(플렉스항목)
         
            1.모든 자식 박스들의 기본 order 값은 0입니다.
            2.마이너스(-3, -2, -1) 같은 음수나 아무 숫자로도 순서를 정할 수 있다
            3.order는 순서 번호가 아니라 "정렬 가중치(크기 비교)" 개념이라서, 음수든 양수든 숫자의 크고 작음만 따집니다


        */
    .flex-container {
        display: flex;
        background-color: dodgerblue;
        font-size: 30px;
        text-align: center;

    } 
    .flex-container div {
        background-color: #f1f1f1;
        margin: 10px;
        padding: 10px;
        width: 100px;
        
    }
    .flex-container div:nth-child(1) { order:3  }   
    .flex-container div:nth-child(2) { order:1  }   
    .flex-container div:nth-child(3) { order:4  }   
    .flex-container div:nth-child(4) { order:2  }   
        
    </style>
</head>
<body>
    <div class="flex-container">
  <div >1</div>
  <div >2</div>
  <div >3</div>
  <div >4</div>
</div>
</body>
</html>
