<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS플렉스 아이템</title>
    <style>
        /* 
            CSS Flex Items(플렉스항목)

        */
    .flex-container {
        display: flex;
        background-color: dodgerblue;
        font-size: 30px;
        text-align: center;
        
    } 
    .flex-container div {
        background-color: #f1f1f1;
        margin: 10px;
        width: 100px;
        padding: 10px;
        
    }
    .flex-container div:nth-child(3) {
        flex-grow:1;
        flex-shrink:0;
        flex-basis: 800px;
        /* 단축 속성 flex: [grow] [shrink] [basis];*/
        flex:1 0 150px;
        /*출발은 150px로 하되, 남으면 키우고, 모자라도 절대 찌그러져서 줄어들지는 마라!" 라는 뜻을 아주 강력하게 압축해 둔 코드*/
     }   
        
    </style>
</head>
<body>
    <div class="flex-container">
  <div >1</div>
  <div >2</div>
  <div >3</div>
  <div >4</div>
  
</div>
</body>
</html>
