<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반응형:미디어쿼리</title>
    <style>
       
        /* light Mode*/
        body {
            background: lightblue;
        }
        /* dark Mode */
        @media (prefers-color-scheme: dark) {
            /* CSS기록 */
         body {background:darkblue;}    
        }
        /* 결과는 개발자 모드 랜더링에서~~
        웹페이지 화면에서 F12를 눌러 개발자 도구를 켜.

        키보드 단축키 Ctrl + Shift + P (맥은 Cmd + Shift + P)를 눌러서 명령 팔레트(Command Menu)를 열어.

        검색창에 Rendering이라고 타이핑하고, 맨 위에 나오는 Show Rendering을 클릭해!

        개발자 도구 아래쪽에 새로운 창(Rendering 탭)이 뜰 텐데, 거기서 쭉 내리다 보면 Emulate CSS media feature prefers-color-scheme라는 옵션이 보일 거야.

        그 옆의 드롭다운 메뉴를 no-preference에서 prefers-color-scheme: dark로 딱 바꿔봐!
        */
    </style>
</head>
<body>
    
</body>
</html>
